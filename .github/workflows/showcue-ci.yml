name: ShowCue CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: showcue-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS (Release + tests)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset macos-ci

      - name: Build
        run: cmake --build --preset macos-ci

      - name: Test
        run: ctest --preset macos-ci --output-on-failure

  build-windows:
    name: Windows (Release + tests)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-ci

      - name: Build
        run: cmake --build --preset windows-ci

      - name: Test
        run: ctest --preset windows-ci --output-on-failure
